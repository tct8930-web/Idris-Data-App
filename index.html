<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idris Data App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .balance {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .screen {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .screen.active {
            display: block;
        }

        .screen h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .continue {
            width: 100%;
            background: #111827;
            color: white;
        }

        .back {
            margin-top: 10px;
            width: 100%;
            background: #eee;
        }

        footer {
            text-align: center;
            padding: 30px 10px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Idris Data App</h1>
        <p>Data, Airtime & Payments</p>
    </header>

    <div class="container">

        <!-- HOME SCREEN -->
        <div id="homeScreen" class="screen active">

            <div class="balance">
                <h2>Wallet Balance</h2>
                <div class="amount">₦0.00</div>
            </div>

            <div class="buttons">
                <button onclick="showFundWallet()">💰 Fund Wallet</button>
                <button>📱 Buy Data</button>
                <button>☎️ Buy Airtime</button>
                <button>📋 Transactions</button>
            </div>

        </div>

        <!-- FUND WALLET SCREEN -->
        <div id="fundScreen" class="screen">

            <h2>Fund Wallet</h2>

            <p>Enter the amount you want to deposit into your wallet.</p>

            <label for="amount">Amount (₦)</label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="100"
            >

            <button class="continue" onclick="startFunding()">
                Continue
            </button>

            <button class="back" onclick="goHome()">
                Back
            </button>

        </div>

    </div>

    <footer>
        ©️ 2026 Idris Data App
    </footer>

    <script>
        function showFundWallet() {
            document.getElementById("homeScreen").classList.remove("active");
            document.getElementById("fundScreen").classList.add("active");
        }

        function goHome() {
            document.getElementById("fundScreen").classList.remove("active");
            document.getElementById("homeScreen").classList.add("active");
        }

        function startFunding() {
            const amount = document.getElementById("amount").value;

            if (!amount || amount < 100) {
                alert("Please enter an amount of at least ₦100.");
                return;
            }

            alert(
                "Funding amount: ₦" +
                Number(amount).toLocaleString() +
                "\n\nPayment connection will be added next."
            );
        }
    </script>

    <!-- CONNECT SUPABASE CONFIGURATION -->
    <script src="config.js"></script>

</body>
</html>
