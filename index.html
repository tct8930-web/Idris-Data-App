<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velqora</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            background: white;
            padding: 35px 25px;
            border-radius: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            text-align: center;
        }

        .welcome h2 {
            margin-top: 0;
            font-size: 26px;
        }

        .welcome p {
            color: #666;
            line-height: 1.6;
        }

        .welcome button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button {
            background: #111827;
            color: white;
        }

        .signup-button {
            background: #eee;
            color: #111827;
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .balance {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .buttons button {
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            font-size: 16px;
            cursor: pointer;
        }

        .logout {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px 10px;
            color: #666;
        }

        #loading {
            text-align: center;
            padding: 40px 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Velqora</h1>
        <p>Data, Airtime & Payments</p>
    </header>

    <div class="container">

        <!-- LOADING -->
        <div id="loading">
            Checking your account...
        </div>

        <!-- WELCOME SCREEN -->
        <div id="welcomeScreen" class="welcome" style="display: none;">

            <h2>Welcome to Velqora</h2>

            <p>
                Your simple platform for data, airtime,
                payments and more.
            </p>

            <button
                class="login-button"
                onclick="window.location.href='login.html'">
                🔐 Login
            </button>

            <button
                class="signup-button"
                onclick="window.location.href='signup.html'">
                👤 Create Account
            </button>

        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="dashboard">

            <div class="balance">
                <h2>Wallet Balance</h2>
                <div class="amount">₦0.00</div>
            </div>

            <div class="buttons">

                <button onclick="startFunding()">
                    💰 Fund Wallet
                </button>

                <button>
                    📱 Buy Data
                </button>

                <button>
                    ☎️ Buy Airtime
                </button>

                <button>
                    💸 Transfer
                </button>

                <button>
                    📋 Transactions
                </button>

                <button>
                    👤 Profile
                </button>

            </div>

            <button class="logout" onclick="logout()">
                🚪 Logout
            </button>

        </div>

    </div>

    <footer>
        © 2026 Velqora
    </footer>

    <script>

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function checkUser() {

            const {
                data: { user }
            } = await supabaseClient.auth.getUser();

            document.getElementById("loading").style.display = "none";

            if (user) {

                document.getElementById("dashboard")
                    .classList.add("active");

            } else {

                document.getElementById("welcomeScreen")
                    .style.display = "block";

            }
        }

        async function logout() {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";
        }

        function startFunding() {

            alert(
                "Wallet funding will be connected securely to the payment provider next."
            );

        }

        checkUser();

    </script>

</body>
</html>
