<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Idris Data App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .balance {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            text-align: center;
            margin-bottom: 20px;
        }

        .balance h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button {
            display: block;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 30px 10px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Idris Data App</h1>
        <p>Data, Airtime & Payments</p>
    </header>

    <div class="container">

        <div class="balance">
            <h2>Wallet Balance</h2>
            <div class="amount">₦0.00</div>
        </div>

        <div class="buttons">
            <button class="button">💰 Fund Wallet</button>
            <button class="button">📱 Buy Data</button>
            <button class="button">☎️ Buy Airtime</button>
            <button class="button">📋 Transactions</button>
        </div>

    </div>

    <footer>
        © 2026 Idris Data App
    </footer>

</body>
</html>
