<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velqora - Activity</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --green: #0f9f6e;
            --dark-green: #07543f;
            --light-green: #effaf4;
            --text: #10201b;
            --muted: #71847d;
            --border: #e4eee9;
            --background: #f5f8f7;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 72px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .back-button {
            width: 43px;
            height: 43px;
            border: 1px solid #dcebe4;
            border-radius: 14px;
            background: #f0faf5;
            color: #087f55;
            font-size: 21px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            overflow: hidden;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 28px 16px 105px;
        }

        .intro {
            margin-bottom: 21px;
        }

        .intro-label {
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .intro h1 {
            margin: 0 0 7px;
            font-size: 29px;
            line-height: 1.1;
        }

        .intro p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .summary {
            background: linear-gradient(
                135deg,
                #0c805b,
                #064c3a
            );
            color: white;
            border-radius: 24px;
            padding: 22px;
            margin-bottom: 24px;
            box-shadow: 0 18px 40px rgba(6,77,60,0.20);
        }

        .summary-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            opacity: 0.72;
            margin-bottom: 7px;
        }

        .summary-title {
            font-size: 21px;
            font-weight: 800;
        }

        .summary-text {
            margin-top: 7px;
            font-size: 13px;
            line-height: 1.45;
            opacity: 0.74;
            max-width: 310px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
        }

        .section-count {
            font-size: 11px;
            color: #879991;
        }

        .transactions {
            display: grid;
            gap: 10px;
        }

        .transaction {
            width: 100%;
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 13px;
            box-shadow: 0 7px 22px rgba(15,50,39,0.055);
            cursor: pointer;
            text-align: left;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .transaction:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(15,50,39,0.09);
        }

        .transaction:active {
            transform: scale(0.99);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .transaction-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 16px;
            background: var(--light-green);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
        }

        .transaction-icon.outgoing {
            background: #fff2f2;
            color: #d23c3c;
        }

        .transaction-icon.pending {
            background: #fff7df;
            color: #b87800;
        }

        .transaction-info {
            min-width: 0;
        }

        .transaction-title {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 4px;
            color: #20342d;
        }

        .transaction-ref {
            color: #84968f;
            font-size: 11px;
            margin-bottom: 4px;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transaction-date {
            color: #a0aea9;
            font-size: 10.5px;
        }

        .transaction-right {
            text-align: right;
            flex-shrink: 0;
        }

        .transaction-amount {
            font-size: 14.5px;
            font-weight: 800;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .amount-positive {
            color: #0c996a;
        }

        .amount-negative {
            color: #d23c3c;
        }

        .amount-pending {
            color: #bd7800;
        }

        .amount-failed {
            color: #d23c3c;
        }

        .status {
            font-size: 9.5px;
            font-weight: 800;
            padding: 5px 8px;
            border-radius: 20px;
            display: inline-block;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff5d9;
            color: #956400;
        }

        .status-success {
            background: #e1f8ea;
            color: #087f55;
        }

        .status-failed {
            background: #fff0f0;
            color: #b52e2e;
        }

        .empty {
            background: white;
            border: 1px solid var(--border);
            border-radius: 23px;
            padding: 52px 22px;
            text-align: center;
            color: #91a39c;
        }

        .empty-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 22px;
            background: var(--light-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .empty h3 {
            color: #344b42;
            margin: 0 0 8px;
            font-size: 18px;
        }

        .empty p {
            margin: 0;
            line-height: 1.5;
            font-size: 13px;
        }

        .loading {
            background: white;
            border: 1px solid var(--border);
            border-radius: 23px;
            padding: 48px 20px;
            text-align: center;
            color: #668078;
        }

        .loading-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #f2d4d4;
            color: #a52e2e;
            border-radius: 18px;
            padding: 19px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Bottom Navigation */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 73px;
            background: rgba(255,255,255,0.97);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 40;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .nav-button {
            background: none;
            border: none;
            color: #9aa9a3;
            font-size: 10.5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 75px;
            padding: 8px 10px;
            border-radius: 14px;
        }

        .nav-button span {
            font-size: 21px;
            line-height: 21px;
        }

        .nav-button.active {
            color: var(--green);
            font-weight: 800;
        }

        /* Transaction Modal */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(4,25,19,0.58);
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }

        .modal-overlay.show {
            display: flex;
        }

        .transaction-modal {
            width: 100%;
            max-width: 560px;
            max-height: 88vh;
            overflow-y: auto;
            background: white;
            border-radius: 28px 28px 0 0;
            padding: 18px 18px 28px;
            box-shadow: 0 -20px 50px rgba(0,0,0,0.18);
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-handle {
            width: 42px;
            height: 5px;
            border-radius: 99px;
            background: #dce5e1;
            margin: 0 auto 20px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .close-button {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background: #f0f5f3;
            color: #466158;
            font-size: 21px;
            cursor: pointer;
        }

        .detail-top {
            text-align: center;
            padding: 4px 0 25px;
        }

        .detail-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px;
            border-radius: 23px;
            background: var(--light-green);
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 29px;
            font-weight: 800;
        }

        .detail-icon.outgoing {
            background: #fff1f1;
            color: #d23c3c;
        }

        .detail-icon.pending {
            background: #fff7df;
            color: #b87800;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .detail-amount {
            font-size: 29px;
            font-weight: 900;
            margin-bottom: 11px;
        }

        .detail-status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            text-transform: capitalize;
        }

        .details-list {
            border-top: 1px solid var(--border);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding: 16px 2px;
            border-bottom: 1px solid #edf2ef;
        }

        .detail-label {
            color: #82948d;
            font-size: 12px;
            flex-shrink: 0;
        }

        .detail-value {
            color: #21352e;
            font-size: 12px;
            font-weight: 700;
            text-align: right;
            word-break: break-word;
            max-width: 65%;
        }

        .copy-reference {
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 14px;
            background: var(--light-green);
            color: #087f55;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Toast */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 91px;
            transform: translateX(-50%) translateY(20px);
            background: #10201b;
            color: white;
            padding: 12px 17px;
            border-radius: 13px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 200;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (min-width: 700px) {

            .modal-overlay {
                align-items: center;
                padding: 20px;
            }

            .transaction-modal {
                border-radius: 28px;
                max-height: 85vh;
            }

            .bottom-nav {
                position: static;
                max-width: 760px;
                margin: 0 auto 20px;
                border: 1px solid var(--border);
                border-radius: 20px;
            }

            .container {
                padding-bottom: 25px;
            }
        }

        @media (max-width: 480px) {

            .container {
                padding: 24px 14px 100px;
            }

            .intro h1 {
                font-size: 26px;
            }

            .summary {
                padding: 20px;
                border-radius: 22px;
            }

            .transaction {
                padding: 14px;
                border-radius: 18px;
            }

            .transaction-icon {
                width: 44px;
                height: 44px;
                border-radius: 15px;
                font-size: 18px;
            }

            .transaction-title {
                font-size: 13px;
            }

            .transaction-ref {
                max-width: 145px;
            }

            .transaction-amount {
                font-size: 13.5px;
            }

            .status {
                font-size: 9px;
                padding: 4px 7px;
            }

            .detail-row {
                gap: 10px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <button
        class="back-button"
        onclick="goBack()"
        aria-label="Back"
    >
        ←
    </button>

    <div class="brand">

        <div class="brand-logo">

            <img
                src="velqora.png.PNG"
                alt="Velqora Logo"
            >

        </div>

        <div class="brand-name">
            Velqora
        </div>

    </div>

</header>


<main class="container">

    <div class="intro">

        <div class="intro-label">
            Wallet
        </div>

        <h1>Activity</h1>

        <p>
            Keep track of your wallet, payments and transfers.
        </p>

    </div>


    <div class="summary">

        <div class="summary-label">
            TRANSACTION HISTORY
        </div>

        <div class="summary-title">

        </div>

        </div>

        Home
    </button>

    <button
        class="nav-button active"
        onclick="goActivity()"

        <span>▣</span>
        Activity
    </button>

    <button
        class="nav-button"
        onclick="goProfile()"
    >
        <span>♙</span>
        Profile
    </button>

</nav>


<!-- Transaction Details Modal -->

<div
    id="transactionModal"
    class="modal-overlay"
    onclick="closeModalOutside(event)"
>

    <div class="transaction-modal">

        <div class="modal-handle"></div>

        <div class="modal-header">

            <h2>
                Transaction details
            </h2>

            <button
                class="close-button"
                onclick="closeTransactionModal()"

            </button>

        </div>


        <div id="transactionDetails">

</div>


<div id="toast" class="toast">
    Reference copied
</div>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentTransactions = [];


function formatAmount(amount) {

    const number = Number(amount || 0);

    return "₦" +
        number.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


function formatDate(dateValue) {

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
        return "Date unavailable";
    }

    return date.toLocaleString(
        "en-NG",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


function getStatusClass(status) {

    const cleanStatus =
        String(status || "").toLowerCase();

    if (
        cleanStatus === "successful" ||
        cleanStatus === "success" ||
        cleanStatus === "completed" ||
        cleanStatus === "delivered"
    ) {
        return "status-success";
    }

    if (
        cleanStatus === "failed" ||
        cleanStatus === "cancelled" ||
        cleanStatus === "canceled"
    ) {
        return "status-failed";
    }

    return "status-pending";
}


function isSuccessful(status) {

    const cleanStatus =
        String(status || "").toLowerCase();

    return (
        cleanStatus === "successful" ||
        cleanStatus === "success" ||
        cleanStatus === "completed" ||
        cleanStatus === "delivered"
    );
}


function isFailed(status) {

    const cleanStatus =
        String(status || "").toLowerCase();

    return (
        cleanStatus === "failed" ||
        cleanStatus === "cancelled" ||
        cleanStatus === "canceled"
    );
}


function getAmountClass(
    status,
    type,
    isIncoming = false
) {

    if (isFailed(status)) {
        return "amount-failed";
    }

    if (
        type === "transfer" ||
        type === "bank_transfer"
    ) {

        if (isIncoming) {
            return "amount-positive";
        }

        return "amount-negative";
    }


    if (
        type === "airtime" ||
        type === "data"
    ) {

        if (isSuccessful(status)) {
            return "amount-negative";
        }

        return "amount-pending";
    }


    if (
        type === "funding"
    ) {

        if (isSuccessful(status)) {
            return "amount-positive";
        }

        return "amount-pending";
    }


    return "amount-pending";
}


function getIcon(
    status,
    type,
    isIncoming = false
) {

    if (isFailed(status)) {
        return "!";
    }

    if (type === "airtime") {
        return "📱";
    }

    if (type === "data") {
        return "📶";
    }

    if (type === "bank_transfer") {
        return "🏦";
    }

    if (type === "transfer") {
        return isIncoming ? "↓" : "↗";
    }

    if (type === "funding") {
        return "₦";
    }

    return "✓";
}


function getTitle(
    type,
    isIncoming = false
) {

    if (type === "funding") {
        return "Wallet Funding";
    }

    if (type === "airtime") {
        return "Airtime Purchase";
    }

    if (type === "data") {
        return "Data Purchase";
    }

    if (type === "bank_transfer") {
        return "Bank Transfer";
    }

    if (type === "transfer") {
        return isIncoming
            ? "Money Received"
            : "Money Sent";
    }

    return "Transaction";
}


function maskAccountNumber(accountNumber) {

    const value =
        String(accountNumber || "");

    if (!value) {
        return "";
    }

    if (value.length <= 4) {
        return value;
    }

    return (
        "••••" +
        value.slice(-4)
    );
}


function getReference(
    transaction,
    isIncoming = false
) {

    if (transaction.type === "funding") {

        return (
            transaction.tx_ref ||
            "Wallet funding"
        );
    }


    if (transaction.type === "airtime") {

        const network =
            transaction.network
                ? transaction.network.toUpperCase()
                : "Airtime";

        const phone =
            transaction.phone || "";

        return network +
            (
                phone
                    ? " • " + phone
                    : ""
            );
    }


    if (transaction.type === "data") {

        const network =
            transaction.network
                ? transaction.network.toUpperCase()
                : "Data";

        const phone =
            transaction.phone || "";

        const plan =
            transaction.plan_name ||
            "Data Plan";

        return (
            network +
            " • " +
            phone +
            " • " +
            plan
        );
    }


    if (transaction.type === "bank_transfer") {

        const accountName =
            transaction.account_name ||
            "Bank recipient";

        const bankName =
            transaction.bank_name ||
            transaction.account_bank ||
            "Bank";

        const accountNumber =
            maskAccountNumber(
                transaction.account_number
            );

        return (
            "To " +
            accountName +
            " • " +
            bankName +
            (
                accountNumber
                    ? " • " + accountNumber
                    : ""
            )
        );
    }


    if (transaction.type === "transfer") {

        if (isIncoming) {
            return "Received into your Velqora wallet";
        }

        if (transaction.account_name) {
            return "To " +
                transaction.account_name;
        }

        return "Velqora transfer";
    }


    return "Transaction";
}


async function getBankTransfers(userId) {

    try {

        const result =
            await supabaseClient
                .from("bank_transfers")
                .select(
                    "id, created_at, user_id, account_bank, account_number, account_name, amount, currency, tx_ref, status, flutterwave_transfer_id"
                )
                .eq(
                    "user_id",
                    userId
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            console.warn(
                "Bank transfers could not be loaded:",
                result.error.message
            );

            return [];
        }


        return result.data || [];

    } catch (error) {

        console.warn(
            "Bank transfer activity warning:",
            error
        );

        return [];
    }
}


function createTransactionHtml(
    transaction,
    index
) {

    const status =
        String(
            transaction.status ||
            "pending"
        );


    const type =
        transaction.type;


    const isIncoming =
        transaction.isIncoming === true;


    const amountClass =
        getAmountClass(
            status,
            type,
            isIncoming
        );


    const icon =
        getIcon(
            status,
            type,
            isIncoming
        );


    const title =
        getTitle(
            type,
            isIncoming
        );


    const reference =
        getReference(
            transaction,
            isIncoming
        );


    let displayAmount =
        formatAmount(
            transaction.amount
        );


    if (
        (
            type === "funding" ||
            (
                type === "transfer" &&
                isIncoming
            )
        ) &&
        isSuccessful(status)
    ) {

        displayAmount =
            "+" + displayAmount;
    }


    if (
        (
            type === "airtime" ||
            type === "data" ||
            type === "bank_transfer" ||
            (
                type === "transfer" &&
                !isIncoming
            )
        ) &&
        (
            isSuccessful(status) ||
            String(status).toLowerCase() === "pending" ||
            String(status).toLowerCase() === "new"
        )
    ) {

        displayAmount =
            "-" + displayAmount;
    }


    let iconClass = "";

    if (
        type === "airtime" ||
        type === "data" ||
        type === "bank_transfer" ||
        (
            type === "transfer" &&
            !isIncoming
        )
    ) {
        iconClass = "outgoing";
    }

    if (!isSuccessful(status) && !isFailed(status)) {
        iconClass = "pending";
    }


    return `

        <button
            class="transaction"
            onclick="openTransaction(${index})"
        >

            <div class="transaction-left">

                <div class="transaction-icon ${iconClass}">
                    ${icon}
                </div>

                <div class="transaction-info">

                    <div class="transaction-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="transaction-ref">
                        ${escapeHtml(reference)}
                    </div>

                    <div class="transaction-date">
                        ${formatDate(
                            transaction.created_at
                        )}
                    </div>

                </div>

            </div>


            <div class="transaction-right">

                <div
                    class="transaction-amount ${amountClass}"
                >
                    ${displayAmount}
                </div>

                <span
                    class="status ${getStatusClass(status)}"
                >
                    ${escapeHtml(status)}
                </span>

            </div>

        </button>

    `;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadTransactions() {

    const content =
        document.getElementById("content");


    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError) {

            throw new Error(
                userError.message
            );
        }


        if (!user) {

            window.location.href =
                "login.html";

            return;
        }


        const [
            walletResult,
            airtimeResult,
            dataResult,
            transferResult
        ] = await Promise.all([

            supabaseClient
                .from("wallet_transactions")
                .select(
                    "id, created_at, amount, tx_ref, currency, status"
                )
                .eq(
                    "user_id",
                    user.id
                ),

            supabaseClient
                .from("airtime_transactions")
                .select(
                    "id, created_at, phone, network, amount, tx_ref, status, provider_reference"
                )
                .eq(
                    "user_id",
                    user.id
                ),

            supabaseClient
                .from("data_transactions")
                .select(
                    "id, created_at, phone, network, plan_name, amount, tx_ref, status, provider_reference"
                )
                .eq(
                    "user_id",
                    user.id
                ),

            supabaseClient
                .from("transfers")
                .select(
                    "id, created_at, user_id, recipient_user_id, bank_code, bank_name, account_number, account_name, amount, fee, tx_ref, status, provider_reference"
                )
                .or(
                    "user_id.eq." +
                    user.id +
                    ",recipient_user_id.eq." +
                    user.id
                )
        ]);


        if (walletResult.error) {

            throw new Error(
                "Wallet activity error: " +
                walletResult.error.message
            );
        }


        if (airtimeResult.error) {

            throw new Error(
                "Airtime activity error: " +
                airtimeResult.error.message
            );
        }


        if (dataResult.error) {

            throw new Error(
                "Data activity error: " +
                dataResult.error.message
            );
        }


        if (transferResult.error) {

            throw new Error(
                "Transfer activity error: " +
                transferResult.error.message
            );
        }


        const bankTransfers =
            await getBankTransfers(
                user.id
            );


        let allTransactions = [];


        /*
         * WALLET FUNDING
         */

        (
            walletResult.data || []
        ).forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "funding",

                    isIncoming: true

                });

            }
        );


        /*
         * AIRTIME
         */

        (
            airtimeResult.data || []
        ).forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "airtime",

                    isIncoming: false

                });

            }
        );


        /*
         * DATA
         */

        (
            dataResult.data || []
        ).forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "data",

                    status:
                        transaction.status ||
                        "pending",

                    isIncoming: false

                });

            }
        );


        /*
         * VELQORA TRANSFERS
         */

        (
            transferResult.data || []
        ).forEach(
            transaction => {

                const isIncoming =
                    transaction.recipient_user_id ===
                    user.id;


                allTransactions.push({

                    ...transaction,

                    type: "transfer",

                    isIncoming

                });

            }
        );


        /*
         * BANK TRANSFERS
         */

        bankTransfers.forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "bank_transfer",

                    status:
                        transaction.status ||
                        "pending",

                    isIncoming: false

                });

            }
        );


        /*
         * NEWEST FIRST
         */

        allTransactions.sort(
            (a, b) => {

                return (
                    new Date(b.created_at) -
                    new Date(a.created_at)
                );

            }
        );


        currentTransactions =
            allTransactions;


        if (
            allTransactions.length === 0
        ) {

            content.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🧾
                    </div>

                    <h3>
                        No activity yet
                    </h3>

                    <p>
                        Your wallet activity will appear here
                        after you make a transaction.
                    </p>

                </div>

            `;

            return;
        }


        let html = `

            <div class="section-header">

                <div class="section-title">
                    Recent transactions
                </div>

                <div class="section-count">

                    ${allTransactions.length}

                    ${
                        allTransactions.length === 1
                            ? "transaction"
                            : "transactions"
                    }

                </div>

            </div>

            <div class="transactions">

        `;


        allTransactions.forEach(
            (transaction, index) => {

                html +=
                    createTransactionHtml(
                        transaction,
                        index
                    );

            }
        );


        html += `

            </div>

        `;


        content.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Activity page error:",
            error
        );


        content.innerHTML = `

            <div class="error">

                <strong>
                    Activity could not load
                </strong>

                <br><br>

                ${
                    escapeHtml(
                        error.message ||
                        error
                    )
                }

            </div>

        `;
    }
}


function openTransaction(index) {

    const transaction =
        currentTransactions[index];


    if (!transaction) {
        return;
    }


    const status =
        String(
            transaction.status ||
            "pending"
        );


    const type =
        transaction.type;


    const isIncoming =
        transaction.isIncoming === true;


    const title =
        getTitle(
            type,
            isIncoming
        );


    const icon =
        getIcon(
            status,
            type,
            isIncoming
        );


    const amount =
        formatAmount(
            transaction.amount
        );


    const amountClass =
        getAmountClass(
            status,
            type,
            isIncoming
        );


    let displayAmount =
        amount;


    if (
        (
            type === "funding" ||
            (
                type === "transfer" &&
                isIncoming
            )
        ) &&
        isSuccessful(status)
    ) {

        displayAmount =
            "+" + amount;
    }


    if (
        (
            type === "airtime" ||
            type === "data" ||
            type === "bank_transfer" ||
            (
                type === "transfer" &&
                !isIncoming
            )
        ) &&
        (
            isSuccessful(status) ||
            String(status).toLowerCase() === "pending" ||
            String(status).toLowerCase() === "new"
        )
    ) {

        displayAmount =
            "-" + amount;
    }


    let iconClass = "";

    if (
        type === "airtime" ||
        type === "data" ||
        type === "bank_transfer" ||
        (
            type === "transfer" &&
            !isIncoming
        )
    ) {
        iconClass = "outgoing";
    }

    if (!isSuccessful(status) && !isFailed(status)) {
        iconClass = "pending";
    }


    const reference =
        transaction.tx_ref ||
        transaction.provider_reference ||
        "Not available";


    let extraRows = "";


    if (type === "transfer") {

        if (isIncoming) {

            extraRows += `

                <div class="detail-row">

                    <div class="detail-label">
                        From
                    </div>

                    <div class="detail-value">
                        ${
                            escapeHtml(
                                transaction.account_name ||
                                "Velqora user"
                            )
                        }
                    </div>

                </div>

            `;

        } else {

            extraRows += `

                <div class="detail-row">

                    <div class="detail-label">
                        To
                    </div>

                    <div class="detail-value">
                        ${
                            escapeHtml(
                                transaction.account_name ||
                                "Velqora user"
                            )
                        }
                    </div>

                </div>

            `;

        }
    }


    if (type === "airtime") {

        extraRows += `

            <div class="detail-row">

                <div class="detail-label">
                    Network
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.network ||
                            "Airtime"
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Phone number
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.phone ||
                            "Not available"
                        )
                    }
                </div>

            </div>

        `;
    }


    if (type === "data") {

        extraRows += `

            <div class="detail-row">

                <div class="detail-label">
                    Network
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.network ||
                            "Data"
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Phone number
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.phone ||
                            "Not available"
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Plan
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.plan_name ||
                            "Data plan"
                        )
                    }
                </div>

            </div>

        `;
    }


    if (
        type === "bank_transfer"
    ) {

        extraRows += `

            <div class="detail-row">

                <div class="detail-label">
                    Recipient
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.account_name ||
                            "Bank recipient"
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Bank
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            transaction.bank_name ||
                            transaction.account_bank ||
                            "Bank"
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Account
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            maskAccountNumber(
                                transaction.account_number
                            )
                        )
                    }
                </div>

            </div>

        `;
    }


    if (
        transaction.fee !== undefined &&
        transaction.fee !== null
    ) {

        extraRows += `

            <div class="detail-row">

                <div class="detail-label">
                    Fee
                </div>

                <div class="detail-value">
                    ${formatAmount(transaction.fee)}
                </div>

            </div>

        `;
    }


    const details =
        document.getElementById(
            "transactionDetails"
        );


    details.innerHTML = `

        <div class="detail-top">

            <div class="detail-icon ${iconClass}">
                ${icon}
            </div>

            <div class="detail-title">
                ${escapeHtml(title)}
            </div>

            <div class="detail-amount ${amountClass}">
                ${displayAmount}
            </div>

            <span
                class="detail-status ${getStatusClass(status)}"
            >
                ${escapeHtml(status)}
            </span>

        </div>


        <div class="details-list">

            ${extraRows}


            <div class="detail-row">

                <div class="detail-label">
                    Date
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            formatDate(
                                transaction.created_at
                            )
                        )
                    }
                </div>

            </div>


            <div class="detail-row">

                <div class="detail-label">
                    Reference
                </div>

                <div class="detail-value">
                    ${
                        escapeHtml(
                            reference
                        )
                    }
                </div>

            </div>

        </div>


        <button
            class="copy-reference"
            onclick="copyReference('${escapeAttribute(reference)}')"
        >
            Copy transaction reference
        </button>

    `;


    document
        .getElementById(
            "transactionModal"
        )
        .classList.add("show");


    document.body.style.overflow =
        "hidden";
}


function escapeAttribute(value) {

    return String(value ?? "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
}


function closeTransactionModal() {

    document
        .getElementById(
            "transactionModal"
        )
        .classList.remove("show");


    document.body.style.overflow =
        "";
}


function closeModalOutside(event) {

    if (
        event.target.id ===
        "transactionModal"
    ) {

        closeTransactionModal();

    }
}


async function copyReference(reference) {

    try {

        await navigator.clipboard.writeText(
            reference
        );

        showToast(
            "Reference copied"
        );

    } catch (error) {

        showToast(
            "Could not copy reference"
        );

    }
}


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        1800
    );
}


function goBack() {

    window.location.href =
        "index.html";
}


function goHome() {

    window.location.href =
        "index.html";
}


function goActivity() {

    window.location.href =
        "transactions.html";
}


function goProfile() {

    window.location.href =
        "profile.html";
}


/*
 * Close modal with Escape.
 */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeTransactionModal();

        }

    }
);


/*
 * Start Activity page.
 */

loadTransactions();

</script>
