<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velqora - Activity</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f8f7;
            color: #10201b;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            background: rgba(255,255,255,0.96);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 13px;
            border-bottom: 1px solid #e2ebe7;
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(15px);
        }

        .back-button {
            border: 1px solid #dcebe4;
            background: #effaf4;
            color: #087f55;
            width: 43px;
            height: 43px;
            border-radius: 13px;
            font-size: 20px;
            cursor: pointer;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: linear-gradient(135deg, #25d366, #0f9f6e);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 6px 16px rgba(37,211,102,0.18);
        }

        .brand-name {
            font-size: 19px;
            font-weight: bold;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
            padding: 27px 16px 100px;
        }

        .intro {
            margin-bottom: 22px;
        }

        .intro-label {
            color: #0f9f6e;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        .intro h1 {
            margin: 0 0 7px;
            font-size: 28px;
            letter-spacing: -0.6px;
        }

        .intro p {
            margin: 0;
            color: #668078;
            line-height: 1.5;
            font-size: 14px;
        }

        /* =========================
           ACTIVITY SUMMARY
        ========================= */

        .summary {
            background:
                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,255,255,0.15),
                    transparent 30%
                ),
                linear-gradient(135deg, #0b7654, #064d3c);
            color: white;
            border-radius: 22px;
            padding: 21px;
            margin-bottom: 22px;
            box-shadow: 0 16px 35px rgba(6,77,60,0.20);
        }

        .summary-label {
            font-size: 12px;
            opacity: 0.75;
            margin-bottom: 6px;
        }

        .summary-title {
            font-size: 20px;
            font-weight: bold;
        }

        .summary-text {
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.75;
        }

        /* =========================
           TRANSACTIONS
        ========================= */

        .transactions {
            display: grid;
            gap: 11px;
        }

        .transaction {
            background: white;
            border: 1px solid #e5eee9;
            border-radius: 19px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            box-shadow: 0 7px 22px rgba(15,50,39,0.055);
        }

        .transaction-left {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .transaction-icon {
            width: 49px;
            height: 49px;
            flex-shrink: 0;
            border-radius: 16px;
            background: #effaf4;
            color: #0f9f6e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
        }

        .transaction-info {
            min-width: 0;
        }

        .transaction-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 5px;
            color: #20342d;
        }

        .transaction-ref {
            color: #91a39c;
            font-size: 11px;
            margin-bottom: 4px;
            max-width: 230px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transaction-date {
            color: #91a39c;
            font-size: 11px;
        }

        .transaction-right {
            text-align: right;
            flex-shrink: 0;
        }

        .transaction-amount {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .amount-positive {
            color: #0f9f6e;
        }

        .amount-pending {
            color: #c47b00;
        }

        .amount-failed {
            color: #d33b3b;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            font-size: 10px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 20px;
            display: inline-block;
            text-transform: capitalize;
        }

        .status-pending {
            background: #fff6db;
            color: #956400;
        }

        .status-success {
            background: #e1f8ea;
            color: #087f55;
        }

        .status-failed {
            background: #fff0f0;
            color: #b52e2e;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            background: white;
            border: 1px solid #e5eee9;
            border-radius: 22px;
            padding: 50px 22px;
            text-align: center;
            color: #91a39c;
            box-shadow: 0 7px 22px rgba(15,50,39,0.055);
        }

        .empty-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 15px;
            border-radius: 21px;
            background: #effaf4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 31px;
        }

        .empty h3 {
            color: #344b42;
            margin: 0 0 8px;
            font-size: 18px;
        }

        .empty p {
            margin: 0;
            line-height: 1.5;
            font-size: 13px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            background: white;
            border: 1px solid #e5eee9;
            border-radius: 22px;
            padding: 45px 20px;
            text-align: center;
            color: #668078;
            box-shadow: 0 7px 22px rgba(15,50,39,0.055);
        }

        .loading-icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* =========================
           ERROR
        ========================= */

        .error {
            background: #fff0f0;
            border: 1px solid #f2d4d4;
            color: #a52e2e;
            border-radius: 17px;
            padding: 18px;
            text-align: center;
            font-size: 13px;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255,255,255,0.97);
            border-top: 1px solid #e2ebe7;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(15px);
        }

        .nav-button {
            background: none;
            border: none;
            color: #94a59e;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 70px;
        }

        .nav-button span {
            font-size: 21px;
        }

        .nav-button.active {
            color: #0f9f6e;
            font-weight: bold;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .container {
                padding: 24px 14px 95px;
            }

            .intro h1 {
                font-size: 25px;
            }

            .transaction {
                padding: 14px;
            }

            .transaction-icon {
                width: 44px;
                height: 44px;
            }

            .transaction-title {
                font-size: 13px;
            }

            .transaction-amount {
                font-size: 14px;
            }

            .transaction-ref {
                max-width: 145px;
            }
        }

        @media (min-width: 700px) {

            .bottom-nav {
                position: static;
                max-width: 750px;
                margin: 0 auto 20px;
                border: 1px solid #e2ebe7;
                border-radius: 18px;
                box-shadow: 0 7px 22px rgba(15,50,39,0.055);
            }

            .container {
                padding-bottom: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <button
            class="back-button"
            onclick="goBack()"
            aria-label="Back"
        >
            ←
        </button>

        <div class="brand">

            <div class="brand-logo">
                V
            </div>

            <div class="brand-name">
                Velqora
            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">

        <div class="intro">

            <div class="intro-label">
                Wallet
            </div>

            <h1>Activity</h1>

            <p>
                View your wallet activity and payment history.
            </p>

        </div>


        <div class="summary">

            <div class="summary-label">
                Transaction History
            </div>

            <div class="summary-title">
                Your wallet activity
            </div>

            <div class="summary-text">
                Payments and wallet funding will appear here.
            </div>

        </div>


        <div id="content">

            <div class="loading">

                <div class="loading-icon">
                    ⏳
                </div>

                Loading your activity...

            </div>

        </div>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-button"
            onclick="goHome()"
        >
            <span>⌂</span>
            Home
        </button>

        <button
            class="nav-button active"
            onclick="goActivity()"
        >
            <span>▣</span>
            Activity
        </button>

        <button
            class="nav-button"
            onclick="goProfile()"
        >
            <span>♙</span>
            Profile
        </button>

    </nav>


    <script>

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        function formatAmount(amount) {

            const number =
                Number(amount);

            return "₦" +
                number.toLocaleString(
                    "en-NG",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );
        }


        function formatDate(dateValue) {

            const date =
                new Date(dateValue);

            return date.toLocaleString(
                "en-NG",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );
        }


        function getStatusClass(status) {

            const cleanStatus =
                String(status || "")
                    .toLowerCase();

            if (
                cleanStatus === "successful" ||
                cleanStatus === "success" ||
                cleanStatus === "completed"
            ) {
                return "status-success";
            }

            if (
                cleanStatus === "failed" ||
                cleanStatus === "cancelled" ||
                cleanStatus === "canceled"
            ) {
                return "status-failed";
            }

            return "status-pending";
        }


        function getAmountClass(status) {

            const cleanStatus =
                String(status || "")
                    .toLowerCase();

            if (
                cleanStatus === "failed" ||
                cleanStatus === "cancelled" ||
                cleanStatus === "canceled"
            ) {
                return "amount-failed";
            }

            if (
                cleanStatus === "successful" ||
                cleanStatus === "success" ||
                cleanStatus === "completed"
            ) {
                return "amount-positive";
            }

            return "amount-pending";
        }


        function getIcon(status) {

            const cleanStatus =
                String(status || "")
                    .toLowerCase();

            if (
                cleanStatus === "successful" ||
                cleanStatus === "success" ||
                cleanStatus === "completed"
            ) {
                return "✓";
            }

            if (
                cleanStatus === "failed" ||
                cleanStatus === "cancelled" ||
                cleanStatus === "canceled"
            ) {
                return "!";
            }

            return "₦";
        }


        async function loadTransactions() {

            const content =
                document.getElementById(
                    "content"
                );


            const {
                data: { user },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (
                userError ||
                !user
            ) {

                window.location.href =
                    "login.html";

                return;
            }


            const {
                data,
                error
            } =
                await supabaseClient
                    .from("wallet_transactions")
                    .select(
                        "id, created_at, amount, tx_ref, currency, status"
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {

                console.error(
                    "Transaction error:",
                    error
                );

                content.innerHTML = `
                    <div class="error">
                        Unable to load your activity right now.
                    </div>
                `;

                return;
            }


            if (
                !data ||
                data.length === 0
            ) {

                content.innerHTML = `
                    <div class="empty">

                        <div class="empty-icon">
                            🧾
                        </div>

                        <h3>No activity yet</h3>

                        <p>
                            Your wallet activity will appear here
                            after you make a transaction.
                        </p>

                    </div>
                `;

                return;
            }


            let html = `
                <div class="transactions">
            `;


            data.forEach(
                transaction => {

                    const status =
                        String(
                            transaction.status ||
                            "pending"
                        );


                    html += `

                        <div class="transaction">

                            <div class="transaction-left">

                                <div class="transaction-icon">
                                    ${getIcon(status)}
                                </div>

                                <div class="transaction-info">

                                    <div class="transaction-title">
                                        Wallet Funding
                                    </div>

                                    <div class="transaction-ref">
                                        ${transaction.tx_ref || "Transaction"}
                                    </div>

                                    <div class="transaction-date">
                                        ${formatDate(transaction.created_at)}
                                    </div>

                                </div>

                            </div>


                            <div class="transaction-right">

                                <div
                                    class="transaction-amount ${getAmountClass(status)}"
                                >
                                    ${formatAmount(transaction.amount)}
                                </div>

                                <span
                                    class="status ${getStatusClass(status)}"
                                >
                                    ${status}
                                </span>

                            </div>

                        </div>

                    `;
                }
            );


            html += `
                </div>
            `;


            content.innerHTML =
                html;
        }


        function goBack() {
            window.location.href =
                "index.html";
        }


        function goHome() {
            window.location.href =
                "index.html";
        }


        function goActivity() {
            window.location.href =
                "transactions.html";
        }


        function goProfile() {
            window.location.href =
                "profile.html";
        }


        loadTransactions();

    </script>

</body>
</html>
