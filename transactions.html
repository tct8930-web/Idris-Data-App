<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Velqora - Activity</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --green: #0f9f6e;
            --dark-green: #07543f;
            --light-green: #effaf4;
            --text: #10201b;
            --muted: #71847d;
            --border: #e4eee9;
            --background: #f5f8f7;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(15,159,110,0.07),
                    transparent 35%
                ),
                var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;

            height: 72px;
            padding: 12px 16px;

            display: flex;
            align-items: center;
            gap: 12px;

            background: rgba(255,255,255,0.94);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .back-button {
            width: 43px;
            height: 43px;

            border: 1px solid #dcebe4;
            border-radius: 14px;

            background: #f0faf5;
            color: #087f55;

            font-size: 21px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s ease;
        }

        .back-button:active {
            transform: scale(0.94);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;

            border-radius: 13px;
            overflow: hidden;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 7px 18px rgba(15,159,110,0.16);

            flex-shrink: 0;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;

            padding:
                28px
                16px
                105px;
        }

        .intro {
            margin-bottom: 21px;
        }

        .intro-label {
            color: var(--green);

            font-size: 11px;
            font-weight: 800;

            text-transform: uppercase;
            letter-spacing: 1px;

            margin-bottom: 7px;
        }

        .intro h1 {
            margin: 0 0 7px;

            font-size: 29px;
            line-height: 1.1;

            letter-spacing: -0.9px;
        }

        .intro p {
            margin: 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        .summary {
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 90% 5%,
                    rgba(255,255,255,0.20),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(255,255,255,0.08),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #0c805b,
                    #064c3a
                );

            color: white;

            border-radius: 24px;

            padding: 22px;

            margin-bottom: 24px;

            box-shadow:
                0 18px 40px rgba(6,77,60,0.20);
        }

        .summary::after {
            content: "";

            position: absolute;

            width: 115px;
            height: 115px;

            right: -35px;
            bottom: -55px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
        }

        .summary-label {
            position: relative;
            z-index: 2;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.5px;

            opacity: 0.72;

            margin-bottom: 7px;
        }

        .summary-title {
            position: relative;
            z-index: 2;

            font-size: 21px;
            font-weight: 800;

            letter-spacing: -0.3px;
        }

        .summary-text {
            position: relative;
            z-index: 2;

            margin-top: 7px;

            font-size: 13px;
            line-height: 1.45;

            opacity: 0.74;

            max-width: 310px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 800;
            color: #243a32;
        }

        .section-count {
            font-size: 11px;
            color: #879991;
        }

        .transactions {
            display: grid;
            gap: 10px;
        }

        .transaction {
            background: rgba(255,255,255,0.98);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 13px;

            box-shadow:
                0 7px 22px rgba(15,50,39,0.055);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .transaction:active {
            transform: scale(0.992);
        }

        .transaction-left {
            display: flex;
            align-items: center;

            gap: 12px;

            min-width: 0;
        }

        .transaction-icon {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            border-radius: 16px;

            background: var(--light-green);
            color: var(--green);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: 800;
        }

        .transaction-info {
            min-width: 0;
        }

        .transaction-title {
            font-weight: 800;

            font-size: 14px;

            margin-bottom: 4px;

            color: #20342d;
        }

        .transaction-ref {
            color: #84968f;

            font-size: 11px;

            margin-bottom: 4px;

            max-width: 245px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transaction-date {
            color: #a0aea9;

            font-size: 10.5px;
        }

        .transaction-right {
            text-align: right;

            flex-shrink: 0;
        }

        .transaction-amount {
            font-size: 14.5px;

            font-weight: 800;

            margin-bottom: 6px;

            white-space: nowrap;
        }

        .amount-positive {
            color: #0c996a;
        }

        .amount-negative {
            color: #d23c3c;
        }

        .amount-pending {
            color: #bd7800;
        }

        .amount-failed {
            color: #d23c3c;
        }

        .status {
            font-size: 9.5px;

            font-weight: 800;

            padding: 5px 8px;

            border-radius: 20px;

            display: inline-block;

            text-transform: capitalize;

            white-space: nowrap;
        }

        .status-pending {
            background: #fff5d9;
            color: #956400;
        }

        .status-success {
            background: #e1f8ea;
            color: #087f55;
        }

        .status-failed {
            background: #fff0f0;
            color: #b52e2e;
        }

        .empty {
            background: white;

            border: 1px solid var(--border);

            border-radius: 23px;

            padding: 52px 22px;

            text-align: center;

            color: #91a39c;

            box-shadow:
                0 7px 22px rgba(15,50,39,0.055);
        }

        .empty-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 16px;

            border-radius: 22px;

            background: var(--light-green);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        .empty h3 {
            color: #344b42;

            margin: 0 0 8px;

            font-size: 18px;
        }

        .empty p {
            margin: 0;

            line-height: 1.5;

            font-size: 13px;

            max-width: 300px;

            margin-left: auto;
            margin-right: auto;
        }

        .loading {
            background: white;

            border: 1px solid var(--border);

            border-radius: 23px;

            padding: 48px 20px;

            text-align: center;

            color: #668078;

            box-shadow:
                0 7px 22px rgba(15,50,39,0.055);
        }

        .loading-icon {
            font-size: 28px;

            margin-bottom: 10px;
        }

        .error {
            background: #fff0f0;

            border: 1px solid #f2d4d4;

            color: #a52e2e;

            border-radius: 18px;

            padding: 19px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            height: 73px;

            background: rgba(255,255,255,0.97);

            border-top: 1px solid var(--border);

            display: flex;
            justify-content: space-around;
            align-items: center;

            z-index: 40;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .nav-button {
            background: none;
            border: none;

            color: #9aa9a3;

            font-size: 10.5px;

            cursor: pointer;

            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 4px;

            min-width: 75px;

            padding: 8px 10px;

            border-radius: 14px;

            transition: 0.2s ease;
        }

        .nav-button span {
            font-size: 21px;

            line-height: 21px;
        }

        .nav-button.active {
            color: var(--green);
            font-weight: 800;
        }

        .nav-button.active span {
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {

            .container {
                padding: 24px 14px 100px;
            }

            .intro h1 {
                font-size: 26px;
            }

            .summary {
                padding: 20px;
                border-radius: 22px;
            }

            .transaction {
                padding: 14px;
                border-radius: 18px;
            }

            .transaction-icon {
                width: 44px;
                height: 44px;

                border-radius: 15px;

                font-size: 18px;
            }

            .transaction-title {
                font-size: 13px;
            }

            .transaction-ref {
                max-width: 145px;
            }

            .transaction-amount {
                font-size: 13.5px;
            }

            .status {
                font-size: 9px;
                padding: 4px 7px;
            }
        }

        @media (min-width: 700px) {

            .bottom-nav {
                position: static;

                max-width: 760px;

                margin:
                    0 auto 20px;

                border:
                    1px solid var(--border);

                border-radius: 20px;

                box-shadow:
                    0 7px 22px rgba(15,50,39,0.055);
            }

            .container {
                padding-bottom: 25px;
            }

            .transaction:hover {
                transform: translateY(-1px);

                box-shadow:
                    0 11px 27px rgba(15,50,39,0.075);
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <button
        class="back-button"
        onclick="goBack()"
        aria-label="Back"
    >
        ←
    </button>

    <div class="brand">

        <div class="brand-logo">
            <img
                src="velqora.png.PNG"
                alt="Velqora Logo"
            >
        </div>

        <div class="brand-name">
            Velqora
        </div>

    </div>

</header>


<main class="container">

    <div class="intro">

        <div class="intro-label">
            Wallet
        </div>

        <h1>Activity</h1>

        <p>
            Keep track of your wallet, payments and transfers.
        </p>

    </div>


    <div class="summary">

        <div class="summary-label">
            TRANSACTION HISTORY
        </div>

        <div class="summary-title">
            Your wallet activity
        </div>

        <div class="summary-text">
            Your funding, airtime, data and transfers will appear here.
        </div>

    </div>


    <div id="content">

        <div class="loading">

            <div class="loading-icon">
                ⏳
            </div>

            Loading your activity...

        </div>

    </div>

</main>


<nav class="bottom-nav">

    <button
        class="nav-button"
        onclick="goHome()"
    >
        <span>⌂</span>
        Home
    </button>

    <button
        class="nav-button active"
        onclick="goActivity()"
    >
        <span>▣</span>
        Activity
    </button>

    <button
        class="nav-button"
        onclick="goProfile()"
    >
        <span>♙</span>
        Profile
    </button>

</nav>


<script>

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


function formatAmount(amount) {

    const number = Number(amount);

    return "₦" +
        number.toLocaleString(
            "en-NG",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
}


function formatDate(dateValue) {

    const date = new Date(dateValue);

    return date.toLocaleString(
        "en-NG",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}


function getStatusClass(status) {

    const cleanStatus =
        String(status || "").toLowerCase();

    if (
        cleanStatus === "successful" ||
        cleanStatus === "success" ||
        cleanStatus === "completed" ||
        cleanStatus === "delivered"
    ) {
        return "status-success";
    }

    if (
        cleanStatus === "failed" ||
        cleanStatus === "cancelled" ||
        cleanStatus === "canceled"
    ) {
        return "status-failed";
    }

    return "status-pending";
}


function getAmountClass(
    status,
    type,
    isIncoming = false
) {

    const cleanStatus =
        String(status || "").toLowerCase();

    if (
        cleanStatus === "failed" ||
        cleanStatus === "cancelled" ||
        cleanStatus === "canceled"
    ) {
        return "amount-failed";
    }

    if (type === "transfer") {

        if (isIncoming) {

            if (
                cleanStatus === "successful" ||
                cleanStatus === "success" ||
                cleanStatus === "completed" ||
                cleanStatus === "delivered"
            ) {
                return "amount-positive";
            }

        } else {

            if (
                cleanStatus === "successful" ||
                cleanStatus === "success" ||
                cleanStatus === "completed" ||
                cleanStatus === "delivered"
            ) {
                return "amount-negative";
            }

        }
    }


    if (
        type === "airtime" ||
        type === "data"
    ) {

        if (
            cleanStatus === "successful" ||
            cleanStatus === "success" ||
            cleanStatus === "completed" ||
            cleanStatus === "delivered"
        ) {
            return "amount-negative";
        }

    }


    if (
        cleanStatus === "successful" ||
        cleanStatus === "success" ||
        cleanStatus === "completed" ||
        cleanStatus === "delivered"
    ) {
        return "amount-positive";
    }

    return "amount-pending";
}


function getIcon(
    status,
    type,
    isIncoming = false
) {

    const cleanStatus =
        String(status || "").toLowerCase();

    if (
        cleanStatus === "failed" ||
        cleanStatus === "cancelled" ||
        cleanStatus === "canceled"
    ) {
        return "!";
    }

    if (type === "airtime") {
        return "📱";
    }

    if (type === "data") {
        return "📶";
    }

    if (type === "transfer") {

        return isIncoming
            ? "↓"
            : "↗️";
    }

    if (type === "funding") {
        return "₦";
    }

    return "✓";
}


function getTitle(
    type,
    isIncoming = false
) {

    if (type === "funding") {
        return "Wallet Funding";
    }

    if (type === "airtime") {
        return "Airtime Purchase";
    }

    if (type === "data") {
        return "Data Purchase";
    }

    if (type === "transfer") {

        return isIncoming
            ? "Money Received"
            : "Money Sent";
    }

    return "Transaction";
}


function getReference(
    transaction,
    isIncoming = false
) {

    if (transaction.type === "funding") {

        return (
            transaction.tx_ref ||
            "Wallet funding"
        );
    }


    if (transaction.type === "airtime") {

        const network =
            transaction.network
                ? transaction.network.toUpperCase()
                : "Airtime";

        const phone =
            transaction.phone || "";

        return network + " • " + phone;
    }


    if (transaction.type === "data") {

        const network =
            transaction.network
                ? transaction.network.toUpperCase()
                : "Data";

        const phone =
            transaction.phone || "";

        return network + " • " + phone;
    }


    if (transaction.type === "transfer") {

        if (isIncoming) {
            return "Received into your Velqora wallet";
        }

        if (transaction.account_name) {
            return "To " + transaction.account_name;
        }

        return "Velqora transfer";
    }


    return "Transaction";
}


async function loadTransactions() {

    const content =
        document.getElementById("content");


    const {
        data: { user },
        error: userError
    } =
        await supabaseClient.auth.getUser();


    if (
        userError ||
        !user
    ) {

        window.location.href =
            "login.html";

        return;
    }


    /*
     * Wallet funding
     */

    const walletPromise =
        supabaseClient
            .from("wallet_transactions")
            .select(
                "id, created_at, amount, tx_ref, currency, status"
            )
            .eq(
                "user_id",
                user.id
            );


    /*
     * Airtime
     */

    const airtimePromise =
        supabaseClient
            .from("airtime_transactions")
            .select(
                "id, created_at, phone, network, amount, tx_ref, status, provider_reference"
            )
            .eq(
                "user_id",
                user.id
            );


    /*
     * Data
     *
     * IMPORTANT:
     * The database column is named "Status"
     * with a capital S.
     */

    const dataPromise =
        supabaseClient
            .from("data_transactions")
            .select(
                'id, created_at, phone, network, amount, tx_ref, "Status", provider_reference'
            )
            .eq(
                "user_id",
                user.id
            );


    /*
     * Velqora transfers
     */

    const transferPromise =
        supabaseClient
            .from("transfers")
            .select(
                "id, created_at, user_id, recipient_user_id, bank_code, bank_name, account_number, account_name, amount, fee, tx_ref, status, provider_reference"
            )
            .or(
                `user_id.eq.${user.id},recipient_user_id.eq.${user.id}`
            );


    const [
        walletResult,
        airtimeResult,
        dataResult,
        transferResult
    ] =
        await Promise.all([
            walletPromise,
            airtimePromise,
            dataPromise,
            transferPromise
        ]);


    console.log(
        "Wallet transactions:",
        walletResult
    );

    console.log(
        "Airtime transactions:",
        airtimeResult
    );

    console.log(
        "Data transactions:",
        dataResult
    );

    console.log(
        "Transfer transactions:",
        transferResult
    );


    if (
        walletResult.error
    ) {

        console.error(
            "Wallet transaction error:",
            walletResult.error
        );

        content.innerHTML = `
            <div class="error">
                Unable to load your wallet activity right now.
            </div>
        `;

        return;
    }


    let allTransactions = [];


    /*
     * Wallet funding
     */

    (
        walletResult.data || []
    ).forEach(
        transaction => {

            allTransactions.push({

                ...transaction,

                type: "funding",

                isIncoming: true

            });

        }
    );


    /*
     * Airtime
     */

    if (
        !airtimeResult.error &&
        airtimeResult.data
    ) {

        airtimeResult.data.forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "airtime",

                    isIncoming: false

                });

            }
        );

    }


    /*
     * Data
     */

    if (
        !dataResult.error &&
        dataResult.data
    ) {

        dataResult.data.forEach(
            transaction => {

                allTransactions.push({

                    ...transaction,

                    type: "data",

                    status:
                        transaction.Status ||
                        transaction.status ||
                        "pending",

                    isIncoming: false

                });

            }
        );

    }


    /*
     * Velqora transfers
     */

    if (
        !transferResult.error &&
        transferResult.data
    ) {

        transferResult.data.forEach(
            transaction => {

                const isIncoming =
                    transaction.recipient_user_id === user.id;

                allTransactions.push({

                    ...transaction,

                    type: "transfer",

                    isIncoming

                });

            }
        );

    }


    /*
     * Sort newest first.
     */

    allTransactions.sort(
        (a, b) => {

            return (
                new Date(b.created_at) -
                new Date(a.created_at)
            );

        }
    );


    if (
        allTransactions.length === 0
    ) {

        content.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    🧾
                </div>

                <h3>No activity yet</h3>

                <p>
                    Your wallet activity will appear here
                    after you make a transaction.
                </p>

            </div>
        `;

        return;
    }


    let html = `

        <div class="section-header">

            <div class="section-title">
                Recent transactions
            </div>

            <div class="section-count">
                ${allTransactions.length}
                ${allTransactions.length === 1 ? "transaction" : "transactions"}
            </div>

        </div>

        <div class="transactions">
    `;


    allTransactions.forEach(
        transaction => {

            const status =
                String(
                    transaction.status ||
                    transaction.Status ||
                    "pending"
                );


            const type =
                transaction.type;


            const isIncoming =
                transaction.isIncoming === true;


            const amountClass =
                getAmountClass(
                    status,
                    type,
                    isIncoming
                );


            const icon =
                getIcon(
                    status,
                    type,
                    isIncoming
                );


            const title =
                getTitle(
                    type,
                    isIncoming
                );


            const reference =
                getReference(
                    transaction,
                    isIncoming
                );


            let displayAmount =
                formatAmount(
                    transaction.amount
                );


            /*
             * Money received is positive.
             */

            if (
                type === "funding"
            ) {

                const cleanStatus =
                    status.toLowerCase();

                if (
                    cleanStatus === "successful" ||
                    cleanStatus === "success" ||
                    cleanStatus === "completed" ||
                    cleanStatus === "delivered"
                ) {

                    displayAmount =
                        "+" +
                        displayAmount;
                }

            }


            if (
                type === "transfer" &&
                isIncoming
            ) {

                const cleanStatus =
                    status.toLowerCase();

                if (
                    cleanStatus === "successful" ||
                    cleanStatus === "success" ||
                    cleanStatus === "completed" ||
                    cleanStatus === "delivered"
                ) {

                    displayAmount =
                        "+" +
                        displayAmount;
                }

            }


            if (
                type === "airtime" ||
                type === "data" ||
                (
                    type === "transfer" &&
                    !isIncoming
                )
            ) {

                const cleanStatus =
                    status.toLowerCase();

                if (
                    cleanStatus === "successful" ||
                    cleanStatus === "success" ||
                    cleanStatus === "completed" ||
                    cleanStatus === "delivered"
                ) {

                    displayAmount =
                        "-" +
                        displayAmount;
                }

            }


            html += `

                <div class="transaction">

                    <div class="transaction-left">

                        <div class="transaction-icon">
                            ${icon}
                        </div>

                        <div class="transaction-info">

                            <div class="transaction-title">
                                ${title}
                            </div>

                            <div class="transaction-ref">
                                ${reference}
                            </div>

                            <div class="transaction-date">
                                ${formatDate(transaction.created_at)}
                            </div>

                        </div>

                    </div>


                    <div class="transaction-right">

                        <div
                            class="transaction-amount ${amountClass}"
                        >
                            ${displayAmount}
                        </div>

                        <span
                            class="status ${getStatusClass(status)}"
                        >
                            ${status}
                        </span>

                    </div>

                </div>

            `;
        }
    );


    html += `
        </div>
    `;


    content.innerHTML =
        html;
}
