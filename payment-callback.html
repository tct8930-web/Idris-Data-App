<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Velqora Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 18px;
            border-radius: 20px;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.18);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            margin: 0 0 10px;
            color: #111;
            font-size: 24px;
        }

        #message {
            color: #666;
            line-height: 1.5;
            margin: 0 0 24px;
        }

        .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e5e5e5;
            border-top-color: #25d366;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .success {
            color: #16833b;
        }

        .error {
            color: #c62828;
        }

        .button {
            display: inline-block;
            margin-top: 10px;
            padding: 13px 22px;
            border-radius: 12px;
            background: #25d366;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">
            <img
                src="velqora.png.PNG"
                alt="Velqora Logo"
            >
        </div>

        <h1 id="title">Verifying Payment</h1>

        <div class="spinner" id="spinner"></div>

        <p id="message">
            Please wait while we securely verify your payment.
        </p>

        <div id="buttonArea"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://xfdqwcfmcxrdoeaoipzr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_X31ddaPFKojwpqe6ezG82g_Qi7su2LM";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        async function verifyPayment() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const transactionId =
                params.get("transaction_id");

            const txRef =
                params.get("tx_ref");

            const status =
                params.get("status");

            if (status === "cancelled") {
                showResult(
                    false,
                    "Payment Cancelled",
                    "Your payment was cancelled. No money was added to your Velqora wallet."
                );
                return;
            }

            if (!transactionId || !txRef) {
                showResult(
                    false,
                    "Payment Information Missing",
                    "We could not find the Flutterwave transaction information."
                );
                return;
            }

            const {
                data: sessionData,
                error: sessionError
            } = await supabaseClient.auth.getSession();

            if (
                sessionError ||
                !sessionData.session
            ) {
                showResult(
                    false,
                    "Login Required",
                    "Your login session could not be found. Please log in again."
                );
                return;
            }

            const {
                data,
                error
            } = await supabaseClient.functions.invoke(
                "verify-payment",
                {
                    body: {
                        transaction_id:
                            transactionId,

                        tx_ref:
                            txRef
                    }
                }
            );

            if (error) {
                console.error(
                    "Verification error:",
                    error
                );

                showResult(
                    false,
                    "Verification Failed",
                    "We could not verify the payment right now. Your wallet has not been credited."
                );

                return;
            }

            if (
                data &&
                data.success
            ) {
                showResult(
                    true,
                    "Payment Successful",
                    "Your payment has been verified and your Velqora wallet has been funded."
                );

                return;
            }

            showResult(
                false,
                "Payment Not Confirmed",
                data?.message ||
                data?.error ||
                "The payment has not been confirmed as successful. Your wallet has not been credited."
            );
        }

        function showResult(
            success,
            title,
            message
        ) {
            document.getElementById(
                "spinner"
            ).style.display = "none";

            const titleElement =
                document.getElementById(
                    "title"
                );

            const messageElement =
                document.getElementById(
                    "message"
                );

            titleElement.textContent =
                title;

            titleElement.className =
                success
                    ? "success"
                    : "error";

            messageElement.textContent =
                message;

            document.getElementById(
                "buttonArea"
            ).innerHTML = `
                <a
                    class="button"
                    href="index.html"
                >
                    Return to Velqora
                </a>
            `;
        }

        verifyPayment();
    </script>

</body>
</html>
