<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#033d25"
    >

    <title>Velqora Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --green-deep: #033d25;
            --green-dark: #045331;
            --green: #087443;
            --green-light: #eaf8f1;
            --text: #10251c;
            --muted: #74827c;
            --white: #ffffff;
            --background: #f4f7f5;
            --border: #e4ebe7;
            --success: #087f5b;
            --danger: #b42318;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eef5f1 0%,
                    #f7f9f8 100%
                );

            color: var(--text);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 22px;
        }

        .page {
            width: 100%;

            max-width: 440px;
        }

        .card {
            position: relative;

            overflow: hidden;

            width: 100%;

            background: white;

            border:
                1px solid rgba(16,37,28,0.045);

            border-radius: 28px;

            padding: 34px 25px 27px;

            text-align: center;

            box-shadow:
                0 20px 55px rgba(16,37,28,0.10);
        }

        .card::before {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            top: -105px;
            right: -80px;

            border-radius: 50%;

            background:
                rgba(8,116,67,0.045);
        }

        .card::after {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            bottom: -75px;
            left: -60px;

            border-radius: 50%;

            background:
                rgba(8,116,67,0.035);
        }

        .content {
            position: relative;

            z-index: 2;
        }

        .logo {
            width: 72px;
            height: 72px;

            margin:
                0 auto 20px;

            border-radius: 21px;

            overflow: hidden;

            background: white;

            border:
                1px solid #e5eee9;

            box-shadow:
                0 12px 28px rgba(3,61,37,0.13);
        }

        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .brand {
            color: var(--green);

            font-size: 11px;

            font-weight: 850;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 9px;
        }

        h1 {
            margin:
                0 0 10px;

            color: var(--text);

            font-size: 25px;

            line-height: 1.15;

            font-weight: 850;

            letter-spacing: -0.7px;
        }

        h1.success {
            color: var(--success);
        }

        h1.error {
            color: var(--danger);
        }

        #message {
            color: var(--muted);

            line-height: 1.6;

            font-size: 13px;

            margin:
                0 auto 22px;

            max-width: 330px;
        }

        /* =========================
           STATUS ICON
        ========================= */

        .status-icon {
            width: 64px;
            height: 64px;

            margin:
                0 auto 19px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            font-weight: 850;
        }

        .status-icon.success {
            background:
                #eaf8f1;

            color:
                var(--success);
        }

        .status-icon.error {
            background:
                #fff1f1;

            color:
                var(--danger);
        }

        /* =========================
           SPINNER
        ========================= */

        .spinner {
            width: 46px;
            height: 46px;

            border:
                4px solid #e4eee9;

            border-top-color:
                var(--green);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

            margin:
                21px auto 24px;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }

        /* =========================
           SECURE MESSAGE
        ========================= */

        .secure-note {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 17px;

            padding-top: 17px;

            border-top:
                1px solid var(--border);

            color: #8a9690;

            font-size: 10px;

            font-weight: 650;
        }

        .secure-icon {
            width: 23px;
            height: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 8px;

            background:
                #f1f6f3;

            color:
                var(--green);

            font-size: 11px;
        }

        /* =========================
           BUTTON
        ========================= */

        .button {
            display: block;

            width: 100%;

            margin-top: 8px;

            padding:
                15px 20px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    var(--green-dark),
                    var(--green)
                );

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 850;

            box-shadow:
                0 10px 23px rgba(4,83,49,0.17);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 13px 28px rgba(4,83,49,0.22);
        }

        .button:active {
            transform:
                translateY(0);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            color: #9aa49f;

            font-size: 10px;

            margin-top: 16px;

            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 380px) {

            body {
                padding: 15px;
            }

            .card {
                padding:
                    29px 19px 23px;

                border-radius: 24px;
            }

            h1 {
                font-size: 23px;
            }

            #message {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="content">

                <div class="logo">

                    <img
                        src="velqora.png.PNG"
                        alt="Velqora Logo"
                    >

                </div>

                <div class="brand">
                    Velqora
                </div>

                <div
                    id="statusIcon"
                    class="status-icon"
                    style="display: none;"
                ></div>

                <h1 id="title">
                    Verifying Payment
                </h1>

                <div
                    class="spinner"
                    id="spinner"
                ></div>

                <p id="message">
                    Please wait while we securely
                    verify your payment.
                </p>

                <div id="buttonArea"></div>

                <div class="secure-note">

                    <span class="secure-icon">
                        ✓
                    </span>

                    Secure payment verification

                </div>

            </div>

        </section>

        <div class="footer">
            Velqora • Payments & Wallet Services
        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://xfdqwcfmcxrdoeaoipzr.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_X31ddaPFKojwpqe6ezG82g_Qi7su2LM";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =========================
           VERIFY PAYMENT
        ========================= */

        async function verifyPayment() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const transactionId =
                params.get(
                    "transaction_id"
                );


            const txRef =
                params.get(
                    "tx_ref"
                );


            const status =
                params.get(
                    "status"
                );


            /* CANCELLED */

            if (
                status ===
                "cancelled"
            ) {

                showResult(
                    false,

                    "Payment Cancelled",

                    "Your payment was cancelled. No money was added to your Velqora wallet."
                );

                return;
            }


            /* MISSING INFORMATION */

            if (
                !transactionId ||
                !txRef
            ) {

                showResult(
                    false,

                    "Payment Information Missing",

                    "We could not find the Flutterwave transaction information."
                );

                return;
            }


            /* CHECK LOGIN */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if (
                sessionError ||
                !sessionData.session
            ) {

                showResult(
                    false,

                    "Login Required",

                    "Your login session could not be found. Please log in again."
                );

                return;
            }


            /* VERIFY WITH BACKEND */

            const {
                data,
                error
            } =
                await supabaseClient
                    .functions
                    .invoke(
                        "verify-payment",
                        {
                            body: {

                                transaction_id:
                                    transactionId,

                                tx_ref:
                                    txRef

                            }
                        }
                    );


            /* ERROR */

            if (error) {

                console.error(
                    "Verification error:",
                    error
                );


                showResult(
                    false,

                    "Verification Failed",

                    "We could not verify the payment right now. Your wallet has not been credited."
                );

                return;
            }


            /* SUCCESS */

            if (
                data &&
                data.success
            ) {

                showResult(
                    true,

                    "Payment Successful",

                    "Your payment has been verified and your Velqora wallet has been funded."
                );

                return;
            }


            /* NOT CONFIRMED */

            showResult(
                false,

                "Payment Not Confirmed",

                data?.message ||
                data?.error ||
                "The payment has not been confirmed as successful. Your wallet has not been credited."
            );
        }


        /* =========================
           SHOW RESULT
        ========================= */

        function showResult(
            success,
            title,
            message
        ) {

            document.getElementById(
                "spinner"
            ).style.display =
                "none";


            const titleElement =
                document.getElementById(
                    "title"
                );


            const messageElement =
                document.getElementById(
                    "message"
                );


            const statusIcon =
                document.getElementById(
                    "statusIcon"
                );


            titleElement.textContent =
                title;


            titleElement.className =
                success
                    ? "success"
                    : "error";


            messageElement.textContent =
                message;


            statusIcon.style.display =
                "flex";


            statusIcon.className =
                success
                    ? "status-icon success"
                    : "status-icon error";


            statusIcon.textContent =
                success
                    ? "✓"
                    : "!";


            document.getElementById(
                "buttonArea"
            ).innerHTML = `

                <a
                    class="button"
                    href="index.html"
                >
                    Return to Velqora
                </a>

            `;
        }


        /* =========================
           START
        ========================= */

        verifyPayment();

    </script>

</body>
</html>
