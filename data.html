<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Velqora - Data</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #111;
            min-height: 100vh;
        }

        .topbar {
            background: #25d366;
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .back-btn {
            border: none;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 13px;
            font-size: 22px;
            cursor: pointer;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            overflow: hidden;
            background: white;
            flex-shrink: 0;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 3px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 18px 40px;
        }

        .balance-card {
            background: #25d366;
            color: white;
            border-radius: 22px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.2);
        }

        .balance-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .balance {
            font-size: 30px;
            font-weight: bold;
            margin-top: 7px;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 13px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #25d366;
        }

        .network-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .network-btn {
            border: 1px solid #ddd;
            background: white;
            border-radius: 12px;
            padding: 12px 5px;
            font-size: 12px;
            cursor: pointer;
        }

        .network-btn.active {
            border-color: #25d366;
            background: #eafff1;
            color: #16833b;
            font-weight: bold;
        }

        .plan-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .plan-btn {
            border: 1px solid #ddd;
            background: white;
            border-radius: 14px;
            padding: 15px 10px;
            text-align: left;
            cursor: pointer;
        }

        .plan-btn.active {
            border-color: #25d366;
            background: #eafff1;
        }

        .plan-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .plan-price {
            font-size: 14px;
            color: #16833b;
            font-weight: bold;
        }

        .info {
            background: #f4f7f5;
            border-radius: 14px;
            padding: 14px;
            margin: 20px 0;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .buy-btn {
            width: 100%;
            border: none;
            background: #25d366;
            color: white;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #c62828;
        }

        .loading {
            color: #666;
        }

        @media (max-width: 380px) {
            .network-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .plan-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ←
        </button>

        <div class="brand-logo">
            <img
                src="velqora.png.PNG"
                alt="Velqora Logo"
            >
        </div>

        <div>
            <div class="brand">Velqora</div>
            <div class="subtitle">Buy Data</div>
        </div>

    </div>

    <main class="container">

        <div class="balance-card">

            <div class="balance-label">
                Available Wallet Balance
            </div>

            <div
                class="balance"
                id="walletBalance"
            >
                Loading...
            </div>

        </div>

        <div class="card">

            <h1>Buy Data</h1>

            <div class="description">
                Buy mobile data directly from your Velqora wallet.
            </div>

            <div class="field">

                <label>
                    Network
                </label>

                <div class="network-grid">

                    <button
                        type="button"
                        class="network-btn active"
                        data-network="mtn"
                        onclick="selectNetwork(this)"
                    >
                        MTN
                    </button>

                    <button
                        type="button"
                        class="network-btn"
                        data-network="airtel"
                        onclick="selectNetwork(this)"
                    >
                        Airtel
                    </button>

                    <button
                        type="button"
                        class="network-btn"
                        data-network="glo"
                        onclick="selectNetwork(this)"
                    >
                        Glo
                    </button>

                    <button
                        type="button"
                        class="network-btn"
                        data-network="9mobile"
                        onclick="selectNetwork(this)"
                    >
                        9mobile
                    </button>

                </div>

            </div>

            <div class="field">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    type="tel"
                    inputmode="numeric"
                    placeholder="08012345678"
                    maxlength="11"
                >

            </div>

            <div class="field">

                <label>
                    Select Data Plan
                </label>

                <div class="plan-grid">

                    <button
                        type="button"
                        class="plan-btn"
                        onclick="selectPlan('500MB', 150, this)"
                    >
                        <div class="plan-name">
                            500MB
                        </div>

                        <div class="plan-price">
                            ₦150
                        </div>
                    </button>

                    <button
                        type="button"
                        class="plan-btn"
                        onclick="selectPlan('1GB', 300, this)"
                    >
                        <div class="plan-name">
                            1GB
                        </div>

                        <div class="plan-price">
                            ₦300
                        </div>
                    </button>

                    <button
                        type="button"
                        class="plan-btn"
                        onclick="selectPlan('2GB', 600, this)"
                    >
                        <div class="plan-name">
                            2GB
                        </div>

                        <div class="plan-price">
                            ₦600
                        </div>
                    </button>

                    <button
                        type="button"
                        class="plan-btn"
                        onclick="selectPlan('5GB', 1500, this)"
                    >
                        <div class="plan-name">
                            5GB
                        </div>

                        <div class="plan-price">
                            ₦1,500
                        </div>
                    </button>

                </div>

            </div>

            <div class="info">
                Real data purchases will be connected to the VTpass
                Live API after your Live API access is approved.
                This page does not process fake purchases.
            </div>

            <button
                class="buy-btn"
                id="buyButton"
                onclick="buyData()"
            >
                Buy Data
            </button>

            <div id="message"></div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script>
        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        let selectedNetwork = "mtn";
        let selectedPlan = null;
        let selectedPrice = null;

        function selectNetwork(button) {

            document
                .querySelectorAll(".network-btn")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            selectedNetwork =
                button.dataset.network;
        }

        function selectPlan(
            plan,
            price,
            button
        ) {

            document
                .querySelectorAll(".plan-btn")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            selectedPlan = plan;
            selectedPrice = price;
        }

        async function loadWallet() {

            const {
                data: {
                    session
                },
                error: sessionError
            } =
                await supabaseClient.auth.getSession();

            if (
                sessionError ||
                !session
            ) {
                window.location.href =
                    "login.html";

                return;
            }

            const {
                data,
                error
            } =
                await supabaseClient
                    .from("wallets")
                    .select("balance")
                    .eq(
                        "user_id",
                        session.user.id
                    )
                    .maybeSingle();

            if (error) {

                document.getElementById(
                    "walletBalance"
                ).textContent =
                    "Unable to load";

                return;
            }

            const balance =
                Number(data?.balance || 0);

            document.getElementById(
                "walletBalance"
            ).textContent =
                "₦" +
                balance.toLocaleString(
                    "en-NG",
                    {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }
                );
        }

        async function buyData() {

            const message =
                document.getElementById("message");

            const button =
                document.getElementById("buyButton");

            const phone =
                document.getElementById("phone").value.trim();

            message.className = "";
            message.textContent = "";

            if (!/^0[0-9]{10}$/.test(phone)) {

                message.className = "error";

                message.textContent =
                    "Enter a valid 11-digit Nigerian phone number.";

                return;
            }

            if (!selectedPlan || !selectedPrice) {

                message.className = "error";

                message.textContent =
                    "Please select a data plan.";

                return;
            }

            const {
                data: {
                    session
                },
                error: sessionError
            } =
                await supabaseClient.auth.getSession();

            if (sessionError || !session) {

                window.location.href = "login.html";

                return;
            }

            button.disabled = true;
            button.textContent = "Preparing...";

            message.className = "loading";
            message.textContent =
                "Preparing your data transaction...";

            const txRef =
                "DATA-" +
                Date.now() +
                "-" +
                crypto.randomUUID();

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "create_pending_data_transaction",
                    {
                        p_phone: phone,
                        p_network: selectedNetwork.toUpperCase(),
                        p_plan_name: selectedPlan,
                        p_amount: selectedPrice,
                        p_tx_ref: txRef
                    }
                );

            if (error) {

                console.error(error);

                button.disabled = false;
                button.textContent = "Buy Data";

                message.className = "error";
                message.textContent =
                    error.message ||
                    "Unable to prepare the data transaction.";

                return;
            }

            console.log(
                "Pending data transaction created:",
                data
            );

            button.disabled = false;
            button.textContent = "Buy Data";

            message.className = "loading";
            message.textContent =
                "Transaction prepared successfully. Real data purchase will be connected when VTpass Live API access is enabled.";
        }

        function goBack() {

            if (
                document.referrer &&
                document.referrer.includes(
                    "tct8930-web.github.io"
                )
            ) {
                history.back();
            } else {
                window.location.href =
                    "index.html";
            }
        }

        loadWallet();
    </script>

</body>
</html>
